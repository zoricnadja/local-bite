events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream auth { zone auth 64k; server auth-service:3001 resolve; }
    upstream raw_materials { zone raw_materials 64k; server raw-materials-service:3002 resolve; }
    upstream products { zone products 64k; server products-service:3003 resolve; }
    upstream productions { zone productions 64k; server productions-service:3004 resolve; }
    upstream orders { zone orders 64k; server orders-service:3005 resolve; }
    upstream read_models { zone read_models 64k; server read-models-service:3006 resolve; }
    upstream frontend { zone frontend 64k; server frontend:80 resolve; }

    server {
        listen 80;

        location = /api/queries/dashboard { proxy_pass http://read_models/dashboard; }
        location = /api/queries/producers { proxy_pass http://read_models/producers; }
        location = /health/queries { proxy_pass http://read_models/health; }

        location /api/raw-materials/ {
            proxy_pass http://raw_materials/raw_materials/;
        }

        location = /api/raw-materials {
            proxy_pass http://raw_materials/raw_materials;
        }
        location /api/orders/ {
            proxy_pass http://orders/orders/;
        }
        location = /api/orders {
            proxy_pass http://orders/orders;
        }
        location /api/auth/ {
            proxy_pass http://auth/;
        }
        location = /api/auth {
            proxy_pass http://auth;
        }
        location /api/productions/batches/ {
            proxy_pass http://productions/batches/;
        }
        location = /api/productions/batches {
            proxy_pass http://productions/batches;
        }
        location /api/products/ {
            proxy_pass http://products/products/;
        }
        location = /api/products {
            proxy_pass http://products/products;
        }

        location /health/auth        { proxy_pass http://auth/health;         }
        location /health/materials   { proxy_pass http://raw_materials/health; }
        location /health/products    { proxy_pass http://products/health;      }
        location /health/productions { proxy_pass http://productions/health;   }
        location /health/orders      { proxy_pass http://orders/health;        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
        }
    }
}
